<style>
/* Layout: one cinematic screen. The Mark 12 core turns behind a centred title and countdown; HUD chrome (nav, brackets, pills, status) is pinned to the edges. */
:root {
  color-scheme: dark;
  --bg: #05070a;            /* Mark 12 canvas */
  --navy: #0a131d;          /* hud-bg */
  --navy-glow: #193652;     /* hud-glow */
  --grid: #3dd6f512;        /* hud-grid */
  --scan: #00000038;        /* hud-scan */
  --ink: #f5f7fa;
  --ink-soft: #f5f7facc;
  --ink-dim: #f5f7fa99;
  --tint: #3dd6f5;          /* the HUD's one bright accent */
  --tint-soft: #3dd6f526;
  --tint-edge: #3dd6f559;
  --tint-faint: #3dd6f50f;
  --amber: #ffb340;
  --gold: #ffb84d;          /* core-gold, only the core and its light use it */
  --hot: #fff3d6;           /* core-hot */
  --ember: #ff7a45;
  --gold-glow: #ffb84d73;
  --pill: #ffffff1a;
  --pill-hover: #ffffff33;
  --pill-edge: #ffffff33;
  --nav: #09090bf2;
  --nav-edge: #ffffff1a;
  --dim: #00000066;
  --scrim: #0000008c;
  --clear: #00000000;
  --vignette: #000000c7;
  --text-shadow: #000000b3;

  --font-display: "Geist", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- Nav ---------- */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--nav);
  border-bottom: 1px solid var(--nav-edge);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.nav-in {
  height: 44px; padding-inline: 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.badge {
  font: 700 11px/1 var(--font-display); letter-spacing: .04em;
  color: var(--tint); background: var(--tint-soft);
  border: 1px solid var(--tint-edge); border-radius: 6px;
  padding: 6px 7px;
}
.nav-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nav-item {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 13px/1 var(--font-display); color: var(--ink-soft);
  padding: 9px 10px; border-radius: 8px;
}
.nav-item.on { color: var(--tint); background: var(--tint-soft); }
.nav-item svg { width: 15px; height: 15px; }
.nav-clock {
  font: 500 11px/1 var(--font-mono); letter-spacing: .14em; color: var(--ink-dim);
  padding: 9px 4px 9px 10px; white-space: nowrap;
}

/* ---------- Hero ---------- */
.hero { position: relative; height: 100%; width: 100%; overflow: hidden; background: var(--navy); }
.stage {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 50%, var(--navy-glow), var(--clear) 70%),
    var(--navy);
}
.grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  background-position: center center;
  -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 30%, transparent 85%);
          mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 30%, transparent 85%);
}
#core { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 46% 30% at 50% 52%, var(--scrim), var(--clear) 72%),
    radial-gradient(ellipse at center, var(--clear) 42%, var(--vignette) 100%),
    var(--dim);
}
.scan {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, var(--clear) 0 2px, var(--scan) 2px 3px);
}
.scan::after {
  content: ""; position: absolute; left: 0; right: 0; height: 18%; top: -20%;
  background: linear-gradient(to bottom, var(--clear), var(--tint-faint) 70%, var(--tint-soft) 98%, var(--clear));
  opacity: .5;
  animation: sweep 9s linear infinite;
}
@keyframes sweep { to { top: 110%; } }

.flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 52%, var(--hot), var(--gold-glow) 30%, var(--clear) 70%);
}
.flash.go { animation: flash 2.2s ease-out; }
@keyframes flash { 0% { opacity: 0; } 12% { opacity: .75; } 100% { opacity: 0; } }

/* Mark 12 corner brackets */
.brackets i {
  position: absolute; width: 22px; height: 22px; pointer-events: none;
  border-color: var(--tint-edge); border-style: solid; border-width: 0;
}
.brackets i:nth-child(1) { top: 64px; left: 16px; border-top-width: 1.5px; border-left-width: 1.5px; }
.brackets i:nth-child(2) { top: 64px; right: 16px; border-top-width: 1.5px; border-right-width: 1.5px; }
.brackets i:nth-child(3) { bottom: 16px; left: 16px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
.brackets i:nth-child(4) { bottom: 16px; right: 16px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

/* ---------- Title + countdown ---------- */
.content {
  position: absolute; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  padding: 56px 16px 0;
  pointer-events: none;
}
.block { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
.heading { max-width: 64rem; display: grid; gap: 8px; }
h1 {
  margin: 0;
  font: 700 clamp(1.3rem, 4.6vw, 1.875rem)/1.2 var(--font-display);
  text-transform: uppercase; letter-spacing: .12em;
  text-wrap: balance; opacity: .95;
  text-shadow: 0 2px 24px var(--text-shadow);
  animation: settle 2.4s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes settle { from { letter-spacing: .32em; opacity: .35; filter: blur(6px); } to { letter-spacing: .12em; opacity: .95; filter: blur(0); } }
.sub {
  margin: 0;
  font: 500 clamp(.7rem, 2.6vw, .875rem)/1.4 var(--font-display);
  text-transform: uppercase; letter-spacing: .3em; color: var(--ink);
  opacity: .7; text-shadow: 0 1px 12px var(--text-shadow);
}

.timer { display: flex; align-items: flex-start; gap: clamp(.45rem, 2.4vw, 1rem); }
.unit { display: flex; flex-direction: column; align-items: center; }
.num, .sep {
  font: 700 clamp(2.3rem, 10.5vw, 3.75rem)/1 var(--font-display);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 28px var(--text-shadow);
}
.num { letter-spacing: .05em; }
.sep { opacity: .6; }
.lab {
  margin-top: 8px;
  font: 300 clamp(.62rem, 2.5vw, .875rem)/1 var(--font-display);
  text-transform: uppercase; letter-spacing: .3em; opacity: .8;
  padding-left: .3em; /* balance the trailing tracking */

.num.bump { animation: bump .45s ease-out; }
@keyframes bump { from { opacity: .3; filter: blur(3px); transform: translateY(-.06em); } to { opacity: 1; filter: blur(0); transform: none; } }

.hero.final .num { color: var(--hot); }
.hero.live .num { color: var(--hot); text-shadow: 0 0 22px var(--gold-glow), 0 2px 28px var(--text-shadow); }

/* ---------- Edge controls ---------- */
.dock {
  position: absolute; z-index: 20; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
}
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 12px/1 var(--font-display); color: var(--ink);
  background: var(--pill); border: 1px solid var(--pill-edge); border-radius: 999px;
  padding: 9px 12px; cursor: pointer; text-decoration: none;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: background .2s;
}
.pill:hover { background: var(--pill-hover); }
.pill:focus-visible { outline: 2px solid var(--tint); outline-offset: 3px; }
.pill svg { width: 14px; height: 14px; flex: none; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); }
.fs { position: absolute; z-index: 20; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

.status {
  position: absolute; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  font: 500 10.5px/1 var(--font-mono); letter-spacing: .24em; text-transform: uppercase;
  color: var(--ink-dim); white-space: nowrap;
}
.status b { font-weight: 500; color: var(--tint); }
.hero.final .status b { color: var(--amber); }
@media (max-width: 720px) { .status { display: none; } }
@media (max-width: 420px) { .nav-item span { display: none; } .brackets i:nth-child(n+3) { display: none; } }

@media (prefers-reduced-motion: reduce) {
  h1, .num.bump, .flash.go { animation: none; }
  .scan::after { display: none; }
}
</style>

    var dpr = Math.min(window.devicePixelRatio || 1, 1.5), r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduce) draw(performance.now(), true);
  }
  function ease(x) { return 1 - Math.pow(1 - x, 3); }

  function draw(now, still) {
    var dt = still ? 1 : Math.min(0.05, (now - last) / 1000), t = (now - t0) / 1000; last = now;
    var eT = mode === 'count' ? 0.62 : mode === 'final' ? 0.92 : 1;
    var sT = mode === 'count' ? 0.55 : mode === 'final' ? 2.4 : 1.1;
    var k = Math.min(1, dt * 3);
    energy += (eT - energy) * k; spin += (sT - spin) * k;
    var sp = mode === 'live' ? 0.07 * Math.sin(t * 8) + 0.035 * Math.sin(t * 13.7) : 0;
    pulse += (sp - pulse) * Math.min(1, dt * 12);
    if (!still) { spinT += dt * spin; yaw += dt * 0.22 * spin; }
    var grow = still ? 1 : ease(Math.min(1, Math.max(0, (t - 0.15) / 2.6)));
    var en = Math.max(0, Math.min(1, energy + (mode === 'count' ? 0.08 * Math.sin(t * 1.3) : 0)));

    // slow camera drift, like a held cinematic shot
    var size = Math.min(W * 0.94, H * 0.82) * (1 + 0.035 * Math.sin(t * 0.09));
    var cx = W / 2 + Math.sin(t * 0.05) * W * 0.012, cy = H * 0.52 + Math.cos(t * 0.043) * H * 0.012;
    var rad = size * 0.44 * (1 + pulse + 0.018 * Math.sin(t * 1.6)) * (0.6 + 0.4 * grow);
    var pitch = 0.32 + 0.08 * Math.sin(t * 0.35), cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), spn = Math.sin(pitch);
    var sc = Math.max(1, size / 340);

    ctx.clearRect(0, 0, W, H);

    // drifting dust in the room
    for (var q = 0; q < dust.length; q++) {
      var d = dust[q], y = ((d.y - t * 0.006 * d.z) % 1 + 1) % 1, x = d.x * W + Math.sin(t * 0.12 + d.ph) * 18 * d.z;
      var tw = 0.5 + 0.5 * Math.sin(t * 0.8 + d.ph * 3);
      ctx.fillStyle = rgba(d.gold ? GOLD : TINT, (0.08 + 0.22 * tw) * d.z * grow);
      var ds = 1 + d.z * 1.6; ctx.fillRect(x, y * H, ds, ds);
    }

    var halo = ctx.createRadialGradient(cx, cy, rad * 0.2, cx, cy, rad * 1.6);
    halo.addColorStop(0, rgba(GOLD, (0.1 + en * 0.2) * grow)); halo.addColorStop(1, rgba(GOLD, 0));
    ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    function proj(x, y, z) {
      var x1 = x * cyw - z * syw, z1 = x * syw + z * cyw, y1 = y * cp - z1 * spn, z2 = y * spn + z1 * cp, f = 1 / (1 + z2 * 0.22);
      return [cx + x1 * rad * f, cy - y1 * rad * f, z2];
    }
    for (var i = 0; i < arcs.length; i++) {
      var a = arcs[i], ph = a.a0 + a.speed * spinT, len = a.len * grow;
      if (len < 0.02) continue;
      var segs = Math.max(8, Math.round(len / (Math.PI * 2) * 96)), pts = [];
      for (var s = 0; s <= segs; s++) {
        var ang = ph + len * s / segs, ca = Math.cos(ang) * a.r, sa = Math.sin(ang) * a.r;
        pts.push(proj(ca * a.u[0] + sa * a.v[0], ca * a.u[1] + sa * a.v[1], ca * a.u[2] + sa * a.v[2]));
      }
      var flick = mode === 'final' ? 0.8 + 0.2 * Math.sin(t * 28 + i * 3.1) : 1;
      for (var ch = 0; ch < 3; ch++) {
        var s0 = Math.floor(segs * ch / 3), s1 = Math.floor(segs * (ch + 1) / 3); if (s1 <= s0) continue;
        var zm = (pts[s0][2] + pts[s1][2]) / 2, al = a.bright * (0.22 + 0.72 * en) * (zm < 0 ? 1 : 0.42 + 0.3 * (1 - zm)) * flick;
        ctx.beginPath(); ctx.moveTo(pts[s0][0], pts[s0][1]);
        for (var p = s0 + 1; p <= s1; p++) ctx.lineTo(pts[p][0], pts[p][1]);
        ctx.strokeStyle = rgba(GOLD, al * 0.16); ctx.lineWidth = a.w * 4 * sc; ctx.stroke();
        ctx.strokeStyle = rgba(GOLD, al); ctx.lineWidth = a.w * sc; ctx.stroke();
        if (a.hot) { ctx.strokeStyle = rgba(HOT, al * 0.7); ctx.lineWidth = 0.8 * sc; ctx.stroke(); }
      }
      if (a.band) {
        ctx.strokeStyle = rgba(GOLD, 0.35 * en * a.bright); ctx.lineWidth = 0.8 * sc; ctx.beginPath();
        for (var b = 0; b <= segs; b += 2) {
          var ang2 = ph + len * b / segs, r2 = a.r * 0.92, c2 = Math.cos(ang2), s2 = Math.sin(ang2);
          var pin = proj(c2 * r2 * a.u[0] + s2 * r2 * a.v[0], c2 * r2 * a.u[1] + s2 * r2 * a.v[1], c2 * r2 * a.u[2] + s2 * r2 * a.v[2]);
          ctx.moveTo(pts[b][0], pts[b][1]); ctx.lineTo(pin[0], pin[1]);
        }
        ctx.stroke();
      }
    }
    // the beam through the centre
    var bl = rad * 1.3 * grow, bg = ctx.createLinearGradient(cx - bl, cy, cx + bl, cy);
    bg.addColorStop(0, rgba(GOLD, 0)); bg.addColorStop(0.5, rgba(HOT, 0.35 + en * 0.4)); bg.addColorStop(1, rgba(GOLD, 0));
    ctx.strokeStyle = bg; ctx.lineWidth = 1.6 * sc; ctx.beginPath(); ctx.moveTo(cx - bl, cy + rad * 0.04); ctx.lineTo(cx + bl, cy - rad * 0.04); ctx.stroke();
    // sparks circling the outside
    for (var e = 0; e < sparks.length; e++) {
      var sk = sparks[e], th = sk[0] + sk[3] * spinT * 0.8, phi = sk[1], rr = sk[2] * (1 + pulse * 1.5);
      var pp = proj(Math.cos(th) * Math.sin(phi) * rr, Math.cos(phi) * rr, Math.sin(th) * Math.sin(phi) * rr);
      var twk = 0.4 + 0.6 * Math.pow(Math.max(0, Math.sin(t * 3 + sk[4] * 20)), 3);
      ctx.fillStyle = rgba(sk[4] > 0.6 ? EMBER : GOLD, twk * (0.25 + en * 0.6) * (pp[2] < 0 ? 1 : 0.5) * grow);
      var ss = 1.8 * sc; ctx.fillRect(pp[0] - ss / 2, pp[1] - ss / 2, ss, ss);
    }
    // white hot centre
    var cr = rad * (0.26 + en * 0.08) * (0.4 + 0.6 * grow), cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
    cg.addColorStop(0, rgba(HOT, 0.95)); cg.addColorStop(0.3, rgba(GOLD, 0.6 + en * 0.3)); cg.addColorStop(1, rgba(GOLD, 0));
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(now) { draw(now, false); requestAnimationFrame(loop); }
  window.addEventListener('resize', resize);
  update();
  resize();
  if (reduce) draw(performance.now(), true); else requestAnimationFrame(loop);
})();
</script>
</body>
